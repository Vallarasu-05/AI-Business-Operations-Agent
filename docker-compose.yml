# Infra only by default (postgres, qdrant, n8n). The app runs fine without them in mock mode.
# Full stack:  docker compose --profile full up --build
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: agentdb}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]
  n8n:
    image: n8nio/n8n
    ports: ["5678:5678"]
    environment:
      - N8N_HOST=localhost
      - WEBHOOK_URL=http://localhost:5678/
    volumes: [n8ndata:/home/node/.n8n]
  backend:
    profiles: ["full"]
    build: ./backend
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - OUTPUT_DIR=/app/outputs
      - N8N_BASE_URL=http://n8n:5678
    volumes: ["./data:/app/data", "./outputs:/app/outputs"]
    ports: ["8000:8000"]
  frontend:
    profiles: ["full"]
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes: {pgdata: {}, qdrantdata: {}, n8ndata: {}}
